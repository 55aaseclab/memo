<style>
:root{--brand:#3451b2;--brand2:#3a5ccc;--bg:#f6f7fb;--card:#fff;--t1:#1f2329;--t2:#5c6470;--t3:#9096a0;--line:#e7e9ef;--green:#18794e;--red:#b8272c;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t1);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:calc(10px + var(--safe-t)) 16px 12px;font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px}
header .ref{background:none;border:0;color:#fff;font-size:18px;padding:2px 6px;cursor:pointer}
header .ref{margin-left:2px}
@keyframes refspin{to{transform:rotate(360deg)}}
header .ref.spin{animation:refspin .45s linear}
header .back{background:none;border:0;color:#fff;font-size:20px;padding:4px 8px;margin-left:-8px;cursor:pointer}
header .sub{font-weight:400;font-size:12px;opacity:.85;margin-left:auto}
main{flex:1;padding:14px 14px calc(88px + var(--safe-b))}
.banner{background:#fff7e6;border:1px solid #ffe2a8;color:#7a5200;border-radius:10px;padding:9px 12px;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.banner button{margin-left:auto;border:0;background:none;color:#7a5200;font-size:16px;cursor:pointer;padding:0 2px}
.banner.warn{background:#fdecec;border-color:#f5c2c2;color:#8f2326}
.cat{margin:16px 2px 8px;font-size:13px;color:var(--t2);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px}
.card.ring{border-color:var(--red);background:var(--red-soft);animation:ringblink 1s ease-in-out infinite}
.step.viewed{border-left:3px solid var(--brand);padding-left:8px;background:#f4f6fd;border-radius:6px}
@keyframes ringblink{50%{background:#fbd5d7}}
.grid.big{gap:12px;margin-top:4px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;cursor:pointer;transition:transform .06s}
.tile.big{padding:26px 16px;border-radius:16px}
.tile.big .em{font-size:34px}
.tile.big .t{font-size:17px;margin-top:8px}
.tile.big .s{font-size:12px}
.tile:active{transform:scale(.97)}
.tile .em{font-size:22px}
.tile .t{font-weight:600;margin-top:6px;font-size:15px}
.tile .s{font-size:12px;color:var(--t3);margin-top:2px;line-height:1.45}
.footbtns{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(12px + var(--safe-b));display:flex;gap:10px;background:linear-gradient(transparent,var(--bg) 30%);max-width:520px;margin:0 auto}
.btn{flex:1;border:0;border-radius:12px;padding:13px 0;font-size:15px;font-weight:600;cursor:pointer}
.btn:active{opacity:.85}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:var(--card);color:var(--t1);border:1px solid var(--line);position:relative}
.btn.ghost .badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:9px;font-size:11px;min-width:18px;line-height:18px;padding:0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.item{display:flex;align-items:flex-start;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-of-type{border-bottom:0}
.item .cb{width:21px;height:21px;border:2px solid #c3c8d4;border-radius:6px;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.item.done .cb{background:var(--green);border-color:var(--green)}
.item.done .txt{color:var(--t3);text-decoration:line-through}
.item .txt{flex:1}
.item .cam{border:0;background:#eef1fb;color:var(--brand);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;flex:none}
.item .why{font-size:12px;color:var(--t3);margin-top:4px}
.thumb{width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
.nophoto{font-size:12px;color:var(--t3);margin-top:6px}
h2{font-size:18px;margin:2px 0 4px}
.sub2{color:var(--t2);font-size:13px;margin-bottom:10px}
.meta{font-size:12px;color:var(--t3);margin-bottom:8px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:10px}
.rec .em{font-size:20px}
.rec .t{font-weight:600;font-size:15px}
.rec .m{font-size:12px;color:var(--t3)}
.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.photogrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.step{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.step:last-child{border-bottom:0}
.step .n{flex:none;width:22px;height:22px;border-radius:50%;background:#eef1fb;color:var(--brand);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.emerg{background:#fdecec;color:#8f2326;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.privacy{font-size:11px;color:var(--t3);text-align:center;margin-top:14px}
.empty{text-align:center;color:var(--t3);padding:40px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));background:rgba(31,35,41,.92);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:60;max-width:80vw}
input.snap{display:none}
.seg{display:flex;gap:8px;margin-bottom:12px}
.segbtn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 0;font-size:14px;font-weight:600;color:var(--t2);cursor:pointer}
.segbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dur{color:var(--brand);font-weight:600}
.cd{font-size:64px;font-weight:800;color:var(--t1);text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
.cd.paused{color:#915930;font-size:24px}
.cd.manual{color:var(--t2);font-size:20px}
.cd.idle{color:var(--t3);font-size:28px}
.step.done .n{background:var(--green-soft);color:var(--green)}
.step.cur{background:#eef1fb;margin:0 -14px;padding:10px 14px}
.step.cur .n{background:var(--brand);color:#fff}
.banner.run{background:#e8f0fe;border-color:#c3d0f5;color:#2a4bb3;cursor:pointer}
.banner.run button{display:none}
.flist{display:flex;flex-direction:column;gap:8px}
.fstep{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.fstep .fhead{display:flex;align-items:center;gap:10px}
.fstep .n{width:24px;height:24px;border-radius:50%;background:var(--gray-soft);color:var(--t2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.fstep .ft{flex:1;font-weight:600;font-size:15px}
.fstep .fd{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.fstep.done .n{background:var(--green-soft);color:var(--green)}
.fstep.fut{opacity:.62}
.fstep.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.fstep.cur .n{background:var(--brand);color:#fff}
.fstep.cur .cd{margin:10px 0 6px}
.fstep.view{border-style:dashed;border-color:var(--brand);cursor:pointer}
.fstep.view .n{background:var(--brand-soft);color:var(--brand)}
.fstep.view .nowmini{margin-top:8px;font-size:12px;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:6px 8px}
.fstep.exp{border-color:var(--red);background:var(--red-soft);animation:ringblink 1s ease-in-out infinite}
.fstep.exp .n{background:var(--red);color:#fff}
.fstep.exp .cd{font-size:40px;color:var(--red)}
.btnrow{display:flex;gap:8px;margin-top:8px}
.btnrow .btn{padding:10px 0;font-size:14px}
</style>
</head>

  <header id="hd"></header>
  <main id="main"></main>
</div>

function renderRecords(){header("我的档案",true);
 const recs=getRecs();
 main.innerHTML=recs.length?recs.map(r=>{const n=r.items.filter(i=>i.photo).length;
 return `<div class="rec" onclick="nav('#/r/${r.id}')"><div class="em">${r.kind==="memo"?"🌸":"🛡"}</div><div style="flex:1"><div class="t">${esc(sceneTitle(r.sceneId))}</div><div class="m">${r.kind==="memo"?"留念 · ":""}${fmt(r.ts)} · 照片 ${n} 张</div></div><div style="color:var(--t3)">›</div></div>`}).join(""):`<div class="empty">还没有凭证<br>去首页开始第一张时刻卡吧</div><button class="btn primary" style="width:100%" onclick="nav('#/')">去首页</button>`;
 extra.innerHTML=""}
function renderRecord(id){const r=getRecs().find(x=>x.id===id);if(!r){renderRecords();return}
 header(r.kind==="memo"?"留念":"凭证详情",true);
 const photos=r.items.filter(i=>i.photo);
 main.innerHTML=`<div class="card"><h2>${esc(sceneTitle(r.sceneId))}</h2><div class="meta">${r.kind==="memo"?"🌸 留念 · ":""}${fmt(r.ts)}</div>
 ${r.items.map(i=>`<div class="item ${i.done?"done":""}" style="cursor:default"><div class="cb">${i.done?"✓":""}</div><div class="txt">${esc(i.t)}${i.photo?`<div class="why">📷 已留证</div>`:""}</div></div>`).join("")}</div>
 ${photos.length?`<div class="card"><div class="meta">照片（带时间水印）</div><div class="photogrid">${photos.map(i=>`<img src="${i.photo}" onclick="lb(this.src)">`).join("")}</div></div>`:""}
 ${r.kind==="memo"?"":`<button class="btn primary" style="width:100%" onclick="copyRec('${r.id}')">📋 复制为文本</button>`}
 <button class="btn ghost" style="width:100%;margin-top:10px" onclick="delRec('${r.id}')">🗑 删除</button>`;
 extra.innerHTML=""}
window.lb=src=>{extra.insertAdjacentHTML("beforeend",`<div class="lightbox" onclick="this.remove()"><img src="${src}"></div>`)};
window.copyRec=id=>{const r=getRecs().find(x=>x.id===id);if(!r)return;
 const txt=r.kind==="memo"?`Memo 留念\n场景：${sceneTitle(r.sceneId)}\n时间：${fmt(r.ts)}`:`Memo 凭证\n场景：${sceneTitle(r.sceneId)}\n时间：${fmt(r.ts)}\n清单：\n${r.items.map(i=>(i.done?"✅ ":"☐ ")+i.t).join("\n")}\n照片：${r.items.filter(i=>i.photo).length} 张（带时间水印，见本机档案）`;
 const ok=()=>toast("已复制，可直接粘贴到申诉/聊天");
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,()=>fallbackCopy(txt,ok))}else fallbackCopy(txt,ok)};
function fallbackCopy(txt,ok){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){toast("复制失败，请手动截屏")}ta.remove()}
window.delRec=id=>{if(!confirm("确定删除此凭证？删除后不可恢复"))return;setRecs(getRecs().filter(x=>x.id!==id));toast("已删除");nav("#/r")};
function renderSosHome(){header("出事了",true);
 main.innerHTML=`<div class="emerg">🚨 人身安全紧急情况：先打 110 / 120，再回来用工具</div>`+INCIDENTS.map(x=>`<div class="rec" onclick="nav('#/sos/${x.id}')"><div class="em">${x.em}</div><div style="flex:1"><div class="t">${esc(x.t)}</div><div class="m">${x.steps.length} 步应对</div></div><div style="color:var(--t3)">›</div></div>`).join("");
 extra.innerHTML=""}
function renderSos(id){const x=INCIDENTS.find(i=>i.id===id);if(!x){renderSosHome();return}
 header(x.t,true);
 const recs=getRecs().filter(r=>(r.kind||"proof")==="proof"&&x.cat.includes(r.sceneId));
 main.innerHTML=`<div class="card">${x.steps.map((s,i)=>`<div class="step"><div class="n">${i+1}</div><div>${esc(s)}</div></div>`).join("")}</div>
 ${recs.length?`<div class="cat">相关凭证</div>${recs.map(r=>{return `<div class="rec" onclick="nav('#/r/${r.id}')"><div class="em">📄</div><div style="flex:1"><div class="t">${esc(sceneTitle(r.sceneId))}</div><div class="m">${fmt(r.ts)}</div></div><div style="color:var(--t3)">›</div></div>`}).join("")}`:`<div class="card" style="color:var(--t3);font-size:13px">本次没有留证。按上面步骤走，以后入场时先开一张时刻卡。</div>`}`;
 extra.innerHTML=""}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
